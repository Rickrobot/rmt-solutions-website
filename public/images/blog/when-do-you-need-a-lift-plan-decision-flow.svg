<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" role="img"><rect width="1600" height="1100" fill="#0f172a"/><text x="800.0" y="64" font-family="'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="800" fill="#f8fafc" text-anchor="middle">Do You Need a Lift Plan?</text><text x="800.0" y="104" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#94a3b8" text-anchor="middle">Every lifting operation must be planned — the detail is what scales</text><rect x="740.0" y="120" width="120" height="4" rx="2" fill="#f59e0b"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#f59e0b"/></marker></defs><rect x="470.0" y="150" width="660" height="76" rx="14" fill="#1e293b" stroke="rgba(245,158,11,0.30)" stroke-width="1.5"/><text x="800.0" y="188.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#f8fafc" text-anchor="middle" dominant-baseline="central">A lifting operation using lifting equipment?</text><line x1="800.0" y1="226" x2="800.0" y2="290" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#ah)"/><rect x="370.0" y="290" width="860" height="96" rx="14" fill="#162033" stroke="#f59e0b" stroke-width="2"/><text x="800.0" y="323.92" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="central">LOLER Reg 8 — it must be planned by a competent person,</text><text x="800.0" y="352.08000000000004" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="central">appropriately supervised and carried out safely</text><line x1="800.0" y1="386" x2="800.0" y2="460" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#ah)"/><rect x="500.0" y="460" width="600" height="86" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/><text x="800.0" y="503.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="800" fill="#f8fafc" text-anchor="middle" dominant-baseline="central">Is the lift simple, routine and low-risk?</text><line x1="620.0" y1="546" x2="430.0" y2="640" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#ah)"/><line x1="980.0" y1="546" x2="1170.0" y2="640" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#ah)"/><text x="515.0" y="593.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" fill="#fbbf24" text-anchor="middle">YES</text><text x="1085.0" y="593.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" fill="#fbbf24" text-anchor="middle">NO</text><rect x="150" y="640" width="560" height="150" rx="14" fill="#1e293b" stroke="rgba(245,158,11,0.30)" stroke-width="1.5"/><text x="430.0" y="688.12" font-family="'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#f8fafc" text-anchor="middle" dominant-baseline="central">Proportionate planning: safe system of</text><text x="430.0" y="715.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#f8fafc" text-anchor="middle" dominant-baseline="central">work, toolbox talk or a generic schedule</text><text x="430.0" y="741.88" font-family="'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#f8fafc" text-anchor="middle" dominant-baseline="central">of common lifts</text><rect x="890" y="640" width="560" height="150" rx="14" fill="#162033" stroke="#f59e0b" stroke-width="2"/><text x="1170.0" y="688.12" font-family="'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#f8fafc" text-anchor="middle" dominant-baseline="central">Detailed written lift plan prepared by a</text><text x="1170.0" y="715.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#f8fafc" text-anchor="middle" dominant-baseline="central">competent person (CPCS Appointed Person</text><text x="1170.0" y="741.88" font-family="'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#f8fafc" text-anchor="middle" dominant-baseline="central">A61)</text><rect x="150" y="850" width="1300" height="170" rx="14" fill="#1e293b" stroke="rgba(245,158,11,0.30)" stroke-width="1.5"/><text x="184" y="894" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" fill="#fbbf24">What pushes a lift to "complex" — needing a full written plan:</text><text x="184" y="938" font-family="'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#cbd5e1" text-anchor="start"><tspan x="184" dy="0">Load over ~1 tonne or awkward / unbalanced  •  near maximum capacity  •  tandem</tspan><tspan x="184" dy="32">(multi-crane) lift  •  poor or uncertain ground  •  near power lines or services  •</tspan><tspan x="184" dy="32">over occupied areas or roads  •  lifting people</tspan></text><text x="1560" y="1072" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#94a3b8" text-anchor="end">RMT Solutions</text></svg>