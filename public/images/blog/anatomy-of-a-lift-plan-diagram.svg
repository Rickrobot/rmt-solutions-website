<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060" role="img"><rect width="1600" height="1060" fill="#0f172a"/><text x="800.0" y="64" font-family="'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="800" fill="#f8fafc" text-anchor="middle">Anatomy of a Lift Plan</text><text x="800.0" y="104" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#94a3b8" text-anchor="middle">The nine elements a LOLER-compliant lift plan should address</text><rect x="740.0" y="120" width="120" height="4" rx="2" fill="#f59e0b"/><rect x="60.0" y="176" width="474.6666666666667" height="232" rx="14" fill="#1e293b" stroke="rgba(245,158,11,0.30)" stroke-width="1.5"/><circle cx="104.0" cy="226" r="22" fill="#f59e0b"/><text x="104.0" y="226" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle" dominant-baseline="central">1</text><text x="90.0" y="294" font-family="'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="700" fill="#f8fafc" text-anchor="start"><tspan x="90.0" dy="0">Description of the</tspan><tspan x="90.0" dy="30">Operation</tspan></text><text x="90.0" y="346" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8" text-anchor="start"><tspan x="90.0" dy="0">What is lifted, from where, to</tspan><tspan x="90.0" dy="23">where and why</tspan></text><rect x="562.6666666666667" y="176" width="474.6666666666667" height="232" rx="14" fill="#1e293b" stroke="rgba(245,158,11,0.30)" stroke-width="1.5"/><circle cx="606.6666666666667" cy="226" r="22" fill="#f59e0b"/><text x="606.6666666666667" y="226" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle" dominant-baseline="central">2</text><text x="592.6666666666667" y="294" font-family="'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="700" fill="#f8fafc" tex